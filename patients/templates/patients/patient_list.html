{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center">Ajouter un Patient</h2>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <small class="text-danger">{{ field.errors|striptags }}</small>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success px-4 py-2">Enregistrer</button>
                <a href="{% url 'patients:patient_list' %}" class="btn btn-secondary px-4 py-2">Retour</a>
                <a href="{% url 'pharmacie:pharmacie_dashboard' %}" class="btn btn-warning px-4 py-2">Retour à la pharmacie</a>
            </div>
        </form>
    </div>
</div>

<style>
    .card {
        border-radius: 15px;
        background-color: #f8f9fa;
    }

    input, select, textarea {
        border-radius: 8px !important;
        padding: 10px !important;
        border: 1px solid #ced4da !important;
        width: 100%;
    }

    button {
        border-radius: 8px;
    }
</style>
{% endblock %}
