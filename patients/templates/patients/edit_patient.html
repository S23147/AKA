{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2 class="mt-4">Modifier les informations du patient</h2>
    <form method="post">
        {% csrf_token %}
        <div class="row">
            {% for field in form %}
            <div class="col-md-6 mb-3">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <small class="text-danger">{{ field.errors|striptags }}</small>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="{% url 'patients:patient_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
