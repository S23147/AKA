{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h2 class="text-center">Ajouter une Consultation</h2>
    <p class="text-center">
      <strong>Patient :</strong> {{ patient.first_name }} {{ patient.last_name }}
    </p>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="text-center">
        <button type="submit" class="btn btn-success px-4 py-2">Enregistrer</button>
        <a href="{% url 'consultation_history' patient_id=patient.pk %}" class="btn btn-secondary px-4 py-2">Retour</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
