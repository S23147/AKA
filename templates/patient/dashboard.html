{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container text-left">
    <h2 class="mt-4">Tableau de bord</h2>
    <p class="text-muted">Gérez facilement vos patients, hôpitaux et médicaments.</p>

    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card shadow-lg">
                <div class="card-body text-center">
                    <img src="{% static 'images/patient.png' %}" width="80">
                    <h5 class="card-title">Patients</h5>
                    <a href="{% url 'patient_list' %}" class="btn btn-primary">Voir</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-lg">
                <div class="card-body text-center">
                    <img src="{% static 'images/hopital.png' %}" width="80">
                    <h5 class="card-title">Hôpitaux</h5>
                    <a href="{% url 'hopital_list' %}" class="btn btn-success">Voir</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-lg">
                <div class="card-body text-center">
                    <img src="{% static 'images/pharmacie.png' %}" width="80">
                    <h5 class="card-title">Pharmacie</h5>
                    <a href="{% url 'pharmacie_dashboard' %}" class="btn btn-danger">Voir</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-lg">
                <div class="card-body text-center">
                    <img src="{% static 'images/consultation.png' %}" width="80">
                    <h5 class="card-title">Consultation</h5>
                    <a href="{% url 'consultation_dashboard' %}" class="btn btn-warning">Voir</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
